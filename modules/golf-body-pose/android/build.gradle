apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.golfbodypose'
version = '0.1.0'

android {
  namespace "expo.modules.golfbodypose"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${safeExtGet('kotlinVersion', '1.9.24')}"

  // MediaPipe Pose Landmarker — Full model support
  // Version pinned to 0.10.14 — the version S0 compiled with.
  // Do NOT upgrade without a separate dependency-upgrade spike.
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
